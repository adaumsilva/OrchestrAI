name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, flag: --win }
          - { name: macos, os: macos-latest, flag: --mac }
          - { name: linux, os: ubuntu-latest, flag: --linux }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux packages (virtual display, tmux, build tools for node-pty)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb tmux build-essential python3
      - run: npm ci
      - run: npm run test:unit
      # Only the Windows job was exercised by hand when these tests were written; macOS and Linux failures here are
      # reported but do not block packaging until someone has run them there.
      - name: End-to-end tests (Linux, virtual display)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: xvfb-run -a npm run test:e2e
      - name: End-to-end tests
        if: runner.os != 'Linux'
        continue-on-error: ${{ runner.os != 'Windows' }}
        run: npm run test:e2e
      - name: Package
        run: npx electron-builder ${{ matrix.flag }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test the packaged app (starts, runs a command in a terminal, orchestrai is on PATH)
        if: runner.os != 'Linux'
        run: node scripts/smoke-packaged.js
      - name: Smoke test the packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-packaged.js
        env:
          SMOKE_ARGS: --no-sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: orchestrai-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
