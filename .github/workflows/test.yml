name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Syntax check
        shell: bash
        run: for f in $(git ls-files 'src/**/*.js' 'bin/*.js' 'tests/**/*.js'); do node --check "$f"; done
      - name: Code changes need tests
        if: github.event_name == 'pull_request'
        shell: bash
        run: node scripts/check-tests-changed.js origin/${{ github.base_ref }}
      - run: npm test
