<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
  <title>OrchestrAI</title>
  <style>
    :root { color-scheme: dark light; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a1a1c; color: #f5f5f7; font: 14px/1.5 system-ui, 'Segoe UI', sans-serif; }
    @media (prefers-color-scheme: light) { body { background: #f6f6f6; color: #1d1d1f; } }
    main { max-width: 460px; padding: 32px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { margin: 6px 0; }
    .muted { opacity: .7; }
    .row { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
    button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #8884; background: #8882; color: inherit; cursor: pointer; }
    button.primary { background: #0a84ff; border-color: #0a84ff; color: #fff; }
    #status { margin-top: 12px; min-height: 1.4em; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">The interface stopped</h1>
    <p id="reason" class="muted"></p>
    <p id="terminals"></p>
    <p id="safe" class="muted">Your workspace is saved. Reloading brings the interface back and reconnects to the terminals.</p>
    <div class="row">
      <button id="reload" class="primary">Reload</button>
      <button id="report">Save diagnostic report…</button>
    </div>
    <div id="status" class="muted"></div>
  </main>
  <script src="recovery.js"></script>
</body>
</html>
